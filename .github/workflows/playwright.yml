name: Playwright Tests & k6 Load Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Generate BDD Specs
      run: npx bddgen

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      env:
        BASE_URL: https://opensource-demo.orangehrmlive.com
        VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
        VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
        INVALID_USERNAME: ${{ secrets.INVALID_USERNAME }}
        INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
        ESS_USERNAME: ${{ secrets.ESS_USERNAME }}
        ESS_PASSWORD: ${{ secrets.ESS_PASSWORD }}
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30